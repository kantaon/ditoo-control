name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Ditoo Control version
      description: Settings → App shows it (e.g. v1.0.0)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: afterburner
    attributes:
      label: Is MSI Afterburner running?
      options: ["Yes", "No", "Don't know"]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Log (copy the relevant lines)
      render: text
